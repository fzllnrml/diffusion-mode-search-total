seed: 42
device: mps
output_dir: runs/mnist_smoke
data:
  root: data/mnist
  download: true
  validation_size: 5000
  split_seed: 42
  train_limit: 32
  validation_limit: 16
model:
  T: 1000
  beta_start: 0.0001
  beta_end: 0.02
  base_channels: 32
  time_dim: 128
training:
  epochs: 1
  batch_size: 16
  lr: 0.0002
  weight_decay: 0.0
  grad_clip: 1.0
  num_workers: 0
  log_every: 100
